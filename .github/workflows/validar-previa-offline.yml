name: Validar prévia offline CERTARE (sem publicar site)
on:
  push:
    branches:
      - "preview/pacotes-01-02-offline-20261124"
    paths:
      - "previews/pacotes-01-02-20261124/**"
      - ".github/workflows/validar-previa-offline.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  testar-previa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Gerar prévia autocontida usando consolidado homologado
        run: |
          python3 previews/pacotes-01-02-20261124/build_preview.py
          test -s previews/pacotes-01-02-20261124/preview_offline.html
          test -s previews/pacotes-01-02-20261124/PACOTES_01_02_backup_preview.zip
          node --check previews/pacotes-01-02-20261124/candidatos/app.js
          node --check previews/pacotes-01-02-20261124/candidatos/vendor/three.min.js
      - name: Preparar Chromium para prévia file e HTML candidato
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Testar dados, Three.js, interação e screenshots desktop/mobile
        run: .venv/bin/python previews/pacotes-01-02-20261124/test_preview.py
      - name: Versionar HTML offline diretamente na branch de prévia
        continue-on-error: true
        run: |
          git config user.name "certare-preview-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/pacotes-01-02-20261124/preview_offline.html
          if ! git diff --cached --quiet; then
            git commit -m "preview: gerar HTML offline validado [skip ci]"
            git push origin HEAD:refs/heads/preview/pacotes-01-02-offline-20261124
          fi
      - name: Entregar backups, HTML offline, candidatos e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponte-ufpi-preview-offline-${{ github.run_number }}
          path: |
            previews/pacotes-01-02-20261124/preview_offline.html
            previews/pacotes-01-02-20261124/PACOTES_01_02_backup_preview.zip
            previews/pacotes-01-02-20261124/screenshots/
          if-no-files-found: warn
          retention-days: 30
