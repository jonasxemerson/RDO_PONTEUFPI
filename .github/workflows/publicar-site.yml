name: Validar dados e publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/publicar-site.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar dados versionados
        run: python3 scripts/validar_dados.py

  publicar:
    if: github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos do painel
        run: |
          mkdir -p site/scripts site/data
          cp index.html site/index.html
          cp scripts/github-dados.js site/scripts/github-dados.js
          cp data/manifest.json site/data/manifest.json
          cp data/observacoes-*.json site/data/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "site"
      - name: Publicar site estático
        id: deploy
        uses: actions/deploy-pages@v4
