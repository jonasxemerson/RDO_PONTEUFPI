name: Validar dados e publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "painel-cliente.html"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/publicar-site.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar dados versionados e gerar pacote público
        run: |
          python3 scripts/validar_dados.py
          python3 -m py_compile scripts/gerar_site_publico.py
          python3 scripts/gerar_site_publico.py
          test -f site/index.html
          test -f site/scripts/modelo-4d-publico.js
          test ! -f site/scripts/github-dados.js
          test ! -f site/painel-cliente.html

  publicar:
    if: github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Gerar distribuição institucional validada
        run: python3 scripts/gerar_site_publico.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "site"
      - name: Publicar site estático
        id: deploy
        uses: actions/deploy-pages@v4
